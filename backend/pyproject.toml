[project]
name = "academic-search-agent-backend"
version = "0.1.0"
description = "AI-powered academic research assistant backend"
readme = "README.md"
authors = [
    { name = "HenrikGharagyozyan1", email = "henrik.gharagyozyan1@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "cachetools>=7.2.0",
    "chromadb>=1.5.9",
    "fastapi>=0.141.1",
    "firecrawl-py>=4.43.0",
    "google-genai>=2.23.0",
    "httpx>=0.28.1",
    "langchain>=1.4.0",
    "langchain-google-genai>=4.4.0",
    "langgraph>=1.2.11",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "tenacity>=9.1.4",
    "uvicorn>=0.53.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
